# The checks that must pass before a commit (see README, "Development"),
# run on GitHub for every push to main and every pull request, so that the
# rule doesn't depend on anyone remembering it.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch makes the older run pointless: stop it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# The job only reads the code. It needs no other access to the repository.
permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.11"

      # --frozen-lockfile fails if bun.lock doesn't match package.json, so a
      # dependency changed without updating the lock is caught here.
      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Format
        run: bun run format:check

      - name: Lint
        run: bun run lint

      - name: Type check
        run: bun run typecheck

      # Also proves the app bundles; the type check alone doesn't.
      - name: Build
        run: bun run build

      - name: Unit tests
        run: bun run test

      # Only the browser the tests use, with the system libraries it needs.
      - name: Install the test browser
        run: bunx playwright install --with-deps chromium

      # Builds again and serves the build. These need no API: the tests
      # answer the pages' requests themselves.
      - name: End-to-end tests
        run: bun run test:e2e
